[project]
name = "structure-report"
version = "0.1.0"
description = "Generate a structure/process map for any Python or JS/TS repo: per-file outline, import graph, and (with an LLM pass) plain-English process breakdowns of big orchestrating functions."
requires-python = ">=3.8"
dependencies = []

[project.scripts]
structure-report = "structure_report:main"
structure-summarize = "structure_summarize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["structure_report", "structure_summarize"]
